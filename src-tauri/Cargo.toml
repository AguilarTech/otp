[package]
name = "otp_messanger"
version = "0.0.0"
description = "One-time Pad Messenger"
authors = ["AguilarTech"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
