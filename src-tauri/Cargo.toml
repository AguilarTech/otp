[package]
name = "otp_messanger"
version = "0.0.0"
description = "One-time Pad Messenger"
authors = ["AguilarTech"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
poly1305 = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
